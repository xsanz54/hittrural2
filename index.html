<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hitster Festival Edition</title>

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0a0a0a;
            --card-bg: #181818;
            --spotify-green: #1DB954;
            --spotify-green-hover: #1ed760;
            --danger-red: #e50914;
            --danger-red-hover: #f6121d;
            --text-main: #ffffff;
            --text-muted: #a7a7a7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #121212;
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            transition: background 0.5s ease;
        }

        @keyframes festival-bg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body.playing-bg {
            background: linear-gradient(45deg, #0a0a0a, #053315, #1DB954, #121212);
            background-size: 300% 300%;
            animation: festival-bg 4s ease infinite;
        }

        .app-container {
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 40px 25px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        #info {
            color: var(--text-muted);
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
            min-height: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .equalizer-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
        }

        .equalizer {
            display: inline-flex;
            align-items: flex-end;
            height: 16px;
            gap: 4px;
            margin-right: 10px;
        }
        .bar {
            width: 5px;
            background-color: var(--spotify-green);
            border-radius: 2px;
            animation: bounce 0.4s infinite alternate;
        }
        .bar:nth-child(1) { animation-delay: 0.1s; height: 10px; }
        .bar:nth-child(2) { animation-delay: 0.3s; height: 16px; }
        .bar:nth-child(3) { animation-delay: 0.0s; height: 8px; }
        .bar:nth-child(4) { animation-delay: 0.2s; height: 14px; }

        @keyframes bounce {
            0% { height: 4px; }
            100% { height: 16px; }
        }

        button {
            width: 100%;
            padding: 18px 20px;
            font-size: 16px;
            border-radius: 50px;
            border: none;
            color: white;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            text-transform: uppercase;
            font-family: 'Outfit', sans-serif;
        }

        button:active { transform: scale(0.96); }

        #loginBtn, #playBtn, #retryBtn { background-color: var(--spotify-green); }
        #loginBtn:hover, #playBtn:hover, #retryBtn:hover {
            background-color: var(--spotify-green-hover);
            box-shadow: 0 8px 25px rgba(29, 185, 84, 0.4);
        }

        #pauseBtn { background-color: var(--danger-red); }
        #pauseBtn:hover {
            background-color: var(--danger-red-hover);
            box-shadow: 0 8px 25px rgba(229, 9, 20, 0.4);
        }

        #openBtn, #nextBtn {
            background-color: #2a2a2a;
            color: #d1d1d1;
        }
        #openBtn:hover, #nextBtn:hover {
            background-color: #3e3e3e;
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.05);
            color: white;
        }
        #nextBtn {
            margin-top: 15px;
            font-size: 14px;
            padding: 15px 20px;
        }

        #timerDisplay {
            font-family: 'Bebas Neue', cursive, sans-serif;
            font-size: 65px;
            margin-top: 10px;
            display: none;
            color: var(--spotify-green);
            text-shadow: 0 0 20px rgba(29, 185, 84, 0.6);
            letter-spacing: 4px;
        }
    </style>
</head>

        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        let cartaId = null;
        let isPaused = false;
        let busy = false;               // evita dobles pulsaciones / dobles peticiones
        let waitingForDevice = false;   // true cuando esperamos a que el usuario abra Spotify

        // ================= TEMPORIZADOR (basado en reloj, no se atrasa en segundo plano) =================
        let timerInterval = null;
        let elapsedMs = 0;
        let startedAt = null;

        function updateTimerDisplay() {
            const total = Math.floor((elapsedMs + (startedAt ? Date.now() - startedAt : 0)) / 1000);
            const m = Math.floor(total / 60);
            const s = total % 60;
            $('timerDisplay').innerText = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
        }
        function startTimer() {
            $('timerDisplay').style.display = 'block';
            if (startedAt === null) startedAt = Date.now();
            if (!timerInterval) timerInterval = setInterval(updateTimerDisplay, 250);
            updateTimerDisplay();
        }
        function stopTimer() {
            if (startedAt !== null) {
                elapsedMs += Date.now() - startedAt;
                startedAt = null;
            }
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
            updateTimerDisplay();
        }
        function resetTimer() {
            stopTimer();
            elapsedMs = 0;
            updateTimerDisplay();
        }

        function soltarPantalla() {
            try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) { }

        // ================= AUTENTICACIÓN (PKCE + refresh token) =================
        async function generateCodeChallenge(codeVerifier) {
            const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(codeVerifier));
            return btoa(String.fromCharCode(...new Uint8Array(digest))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        function generateRandomString(length) {
            const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            const values = crypto.getRandomValues(new Uint8Array(length));
            let text = '';
            for (let i = 0; i < length; i++) text += possible.charAt(values[i] % possible.length);
            return text;
        }

        async function login() {
            const verifier = generateRandomString(128);
            localStorage.setItem('code_verifier', verifier);
            const challenge = await generateCodeChallenge(verifier);
            const params = new URLSearchParams({
                client_id: clientId,
                response_type: 'code',
                redirect_uri: redirectUri,
                scope: SCOPES,
                code_challenge_method: 'S256',
                code_challenge: challenge
            });
            // Guardamos la carta escaneada en "state" para volver a ella tras el login
            if (cartaId) params.set('state', cartaId);
            window.location.href = 'https://accounts.spotify.com/authorize?' + params.toString();
        }

        function saveTokens(data) {
            localStorage.setItem('spotify_token', data.access_token);
            if (data.refresh_token) localStorage.setItem('spotify_refresh', data.refresh_token);
            // Margen de 60 s para no usar un token a punto de caducar
            localStorage.setItem('spotify_expires_at', String(Date.now() + (data.expires_in - 60) * 1000));
        }

        function clearTokens() {
            localStorage.removeItem('spotify_token');
            localStorage.removeItem('spotify_refresh');
            localStorage.removeItem('spotify_expires_at');
        }

        async function intercambiarCodigo(code) {
            const verifier = localStorage.getItem('code_verifier');
            if (!verifier) return false;
            try {
                const r = await fetch(TOKEN_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        client_id: clientId,
                        grant_type: 'authorization_code',
                        code: code,
                        redirect_uri: redirectUri,
                        code_verifier: verifier
                    })
                });
                const data = await r.json();
                if (!data.access_token) return false; // antes se guardaba "undefined" como token
                saveTokens(data);
                localStorage.removeItem('code_verifier');
                return true;
            } catch (e) {
                return false;
            }
        }

        async function refrescarToken() {
            const refresh = localStorage.getItem('spotify_refresh');
            if (!refresh) return false;
            try {
                const r = await fetch(TOKEN_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        client_id: clientId,
                        grant_type: 'refresh_token',
                        refresh_token: refresh
                    })
                });
                const data = await r.json();
                if (!data.access_token) return false;
                saveTokens(data);
                return true;
            } catch (e) {
                return false;
            }
        }

        async function getToken() {
            const token = localStorage.getItem('spotify_token');
            const exp = Number(localStorage.getItem('spotify_expires_at') || 0);
            if (token && Date.now() < exp) return token;
            if (await refrescarToken()) return localStorage.getItem('spotify_token');
            return null;
        }

        // Llamada a la API con renovación automática del token si da 401
        async function api(path, opts = {}) {
            const token = await getToken();
            if (!token) throw new Error('NO_TOKEN');
            const hacer = t => fetch(API_URL + path, {
                ...opts,
                headers: { ...(opts.headers || {}), 'Authorization': 'Bearer ' + t }
            });
            let r = await hacer(token);
            if (r.status === 401 && await refrescarToken()) {
                r = await hacer(localStorage.getItem('spotify_token'));
            }
            return r;
        }

        // ================= DISPOSITIVOS =================
        function elegirDispositivo(devices) {
            const usables = devices.filter(d => d.id && !d.is_restricted);
            const ultimo = localStorage.getItem('last_device_id');
            return usables.find(d => d.is_active)
                || usables.find(d => d.id === ultimo)
                || usables.find(d => d.type === 'Smartphone')
                || usables[0]
                || null;
        }

        function abrirSpotify() {
            // Abre la app de Spotify; al volver a esta pestaña se reintenta solo
            window.location.href = 'spotify:';
        }

        function mostrarSinDispositivo() {
            waitingForDevice = true;
            isPaused = false;
            setInfo("<b>⚠️ No encuentro tu Spotify.</b><br><br>Pulsa <b>Abrir Spotify</b>, espera un par de segundos y vuelve aquí: se reintentará solo. Si no, pulsa Reintentar.");
            mostrarBotones('openBtn', 'retryBtn');
        }

        async function manejarError(r) {
            let reason = '';
            try { const j = await r.json(); reason = (j.error && j.error.reason) || ''; } catch (e) { }

            if (r.status === 401) {
                clearTokens();
                setInfo("La sesión de Spotify ha caducado.<br>Pulsa conectar de nuevo.");
                mostrarBotones('loginBtn');
            } else if (r.status === 403) {
                if (reason === 'PREMIUM_REQUIRED') {
                    setInfo("<b>⚠️ Hace falta Spotify Premium</b> para controlar la reproducción desde la web.");
                } else {
                    setInfo("<b>⚠️ Spotify ha rechazado la petición (403).</b><br><br>Comprueba que tu cuenta está añadida en <i>User Management</i> del dashboard de Spotify y que es Premium.");
                }
                mostrarBotones('retryBtn');
            } else if (r.status === 404) {
                mostrarSinDispositivo();
            } else if (r.status === 429) {
                setInfo("Spotify va saturado. Espera unos segundos y reintenta.");
                mostrarBotones('retryBtn');
            } else {
                setInfo("Error de Spotify (" + r.status + ").<br>Pulsa reintentar.");
                mostrarBotones('retryBtn');
            }
        }

        // ================= REPRODUCCIÓN =================
        function alEmpezar(reanudando) {
            setInfo("<div class='equalizer-container'><div class='equalizer'><div class='bar'></div><div class='bar'></div><div class='bar'></div><div class='bar'></div></div> <span style='font-weight:bold; color:white;'>¡REPRODUCIENDO!</span></div>");
            $('playBtn').textContent = '▶️ Reproducir Pista';
            mostrarBotones('pauseBtn', 'nextBtn');
            document.body.classList.add('playing-bg');
            if (!reanudando) resetTimer();
            isPaused = false;
            startTimer();
            mantenerPantalla();
        }

        async function reproducir() {
            if (busy) return;
            busy = true;
            waitingForDevice = false;
            const reanudando = isPaused;
            setInfo("Conectando con Spotify...");
            mostrarBotones();

            try {
                // 1) Buscamos un dispositivo (así no depende de que Spotify esté "activo")
                const dr = await api('/me/player/devices');
                if (!dr.ok) { await manejarError(dr); return; }
                const devices = (await dr.json()).devices || [];
                const device = elegirDispositivo(devices);
                if (!device) { mostrarSinDispositivo(); return; }

                // 2) Reproducimos (o reanudamos) indicando el dispositivo
                const opts = { method: 'PUT' };
                if (!reanudando) {
                    opts.headers = { 'Content-Type': 'application/json' };
                    opts.body = JSON.stringify({ uris: [canciones[cartaId]] });
                }
                const r = await api('/me/player/play?device_id=' + encodeURIComponent(device.id), opts);

                if (r.ok || r.status === 204) {
                    localStorage.setItem('last_device_id', device.id);
                    alEmpezar(reanudando);
                } else {
                    isPaused = false; // si falla una reanudación, el siguiente intento reinicia la pista
                    await manejarError(r);
                }
            } catch (e) {
                if (e.message === 'NO_TOKEN') {
                    setInfo("Hay que conectar con Spotify.");
                    mostrarBotones('loginBtn');
                } else {
                    isPaused = false;
                    setInfo("Error de red.<br>Comprueba tu conexión y pulsa reintentar.");
                    mostrarBotones('retryBtn');
                }
            } finally {
                busy = false;
            }
        }

        async function pausar() {
            try {
                const r = await api('/me/player/pause', { method: 'PUT' });
                if (r.ok || r.status === 204) {
                    setInfo("⏸ Pista en pausa.");
                    $('playBtn').textContent = '▶️ Reanudar Pista';
                    mostrarBotones('playBtn', 'nextBtn');
                    document.body.classList.remove('playing-bg');
                    isPaused = true;
                    stopTimer();
                    soltarPantalla();
                } else {
                    await manejarError(r);
                }
            } catch (e) {
                setInfo("No se pudo pausar. Inténtalo de nuevo.");
            }
        }

        function siguienteCarta() {
            if (!isPaused) api('/me/player/pause', { method: 'PUT' }).catch(() => { });
            stopTimer();
            soltarPantalla();
            document.body.classList.remove('playing-bg');
            mostrarBotones();
            $('timerDisplay').style.display = 'none';
            setInfo(`
                <div style='font-size: 26px; color: var(--spotify-green); margin-bottom: 15px; font-weight: bold;'>
                    ✅ Pista terminada
                </div>
                <div style='font-size: 18px; color: white;'>
                    Cierra esta pestaña y <b>abre la cámara de tu móvil</b> para escanear la siguiente carta.
                </div>
            `);
        }

        // Al volver desde la app de Spotify, reintentamos automáticamente
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && waitingForDevice && !busy) setTimeout(reproducir, 1500);
        });

        // ================= ARRANQUE =================
        function normalizarId(id) {
            if (!id) return null;
            id = String(id).trim();
            return /^\d+$/.test(id) ? 'carta' + id : id; // permite ?id=5 además de ?id=carta5
        }

        function limpiarUrl() {
            const nueva = redirectUri + (cartaId ? '?id=' + encodeURIComponent(cartaId) : '');
            history.replaceState({}, '', nueva);
        }

        async function iniciarApp() {
            const token = await getToken();
            if (!token) {
                setInfo("Conecta la web con Spotify para que la música suene de forma invisible.");
                mostrarBotones('loginBtn');
                return;
            }
            if (!cartaId) {
                setInfo("Conectado y listo. Escanea cualquier código QR para empezar.");
                mostrarBotones();
                return;
            }
            if (!canciones[cartaId]) {
                setInfo("Error: la carta «" + escapeHtml(cartaId) + "» no está guardada en el código.");
                mostrarBotones();
                return;
            }
            if (AUTOPLAY) {
                reproducir();
            } else {
                setInfo("¡Lista!<br><br>Asegúrate de tener Spotify abierto de fondo y pulsa reproducir.");
                mostrarBotones('playBtn');
            }
        }

        (async function main() {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            const authError = params.get('error');
            cartaId = normalizarId(params.get('id') || params.get('state'));

            if (authError) {
                limpiarUrl();
                setInfo("Spotify no ha dado permiso.<br>Pulsa conectar para intentarlo de nuevo.");
                mostrarBotones('loginBtn');
                return;
            }

            if (code) {
                setInfo("Validando conexión...");
                const ok = await intercambiarCodigo(code);
                limpiarUrl(); // quita ?code=... para que un refresco no reutilice un código ya gastado
                if (!ok) {
                    setInfo("Error en la conexión.<br>Pulsa conectar para reintentarlo.");
                    mostrarBotones('loginBtn');
                    return;
                }
            }

            iniciarApp();
        })();
    </script>
</body>
