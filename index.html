<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hitster Secreto</title>
    <style>
        body { background-color: #121212; color: white; font-family: sans-serif; text-align: center; padding-top: 80px; }
        button { background-color: #1DB954; color: white; border: none; padding: 20px 40px; font-size: 20px; border-radius: 40px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #1ed760; }
        #info { margin-top: 30px; color: #b3b3b3; font-size: 18px; padding: 0 20px; }
    </style>
</head>
<body>

    <h1>🎧 Hitster Party</h1>
    <div id="info">Pulsa el botón para reproducir la pista en secreto:</div>
    <br><br>
    <button onclick="reproducir()">REPRODUCIR PISTA</button>

    <script>
        // Tus canciones configuradas
        const canciones = {
            "carta1": "5dAtKXyrQoQW054LZqJ5dP", 
            "carta2": "0VjIjW4GlUZAMYd2vXMi3b"  
        };

        const urlParams = new URLSearchParams(window.location.search);
        const cartaId = urlParams.get('id');

        function reproducir() {
            if (cartaId && canciones[cartaId]) {
                const trackId = canciones[cartaId];
                // Abre directamente la app de Spotify en el móvil con la canción
                window.location.href = `spotify:track:${trackId}`;
            } else {
                alert("Código de carta no válido o no encontrado.");
            }
        }
    </script>
</body>
</html>
