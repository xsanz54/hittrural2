<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hitster Festival Edition</title>
    
    <!-- Importación de las fuentes Bebas Neue y Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --card-bg: #181818;
            --spotify-green: #1DB954;
            --spotify-green-hover: #1ed760;
            --danger-red: #e50914;
            --danger-red-hover: #f6121d;
            --text-main: #ffffff;
            --text-muted: #a7a7a7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            background: #121212; /* Fondo base */
            color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            transition: background 0.5s ease;
        }

        /* MAGIA FESTIVAL: Animación del fondo cuando está sonando */
        @keyframes festival-bg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body.playing-bg {
            background: linear-gradient(45deg, #0a0a0a, #053315, #1DB954, #121212);
            background-size: 300% 300%;
            animation: festival-bg 4s ease infinite;
        }

        /* Contenedor principal */
        .app-container {
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 40px 25px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        #info { 
            color: var(--text-muted); 
            font-size: 16px; 
            line-height: 1.6; 
            margin-bottom: 30px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Animación del ecualizador de sonido */
        .equalizer {
            display: inline-flex;
            align-items: flex-end;
            height: 16px;
            gap: 4px;
            margin-right: 10px;
        }
        .bar {
            width: 5px;
            background-color: var(--spotify-green);
            border-radius: 2px;
            animation: bounce 0.4s infinite alternate;
        }
        .bar:nth-child(1) { animation-delay: 0.1s; height: 10px; }
        .bar:nth-child(2) { animation-delay: 0.3s; height: 16px; }
        .bar:nth-child(3) { animation-delay: 0.0s; height: 8px; }
        .bar:nth-child(4) { animation-delay: 0.2s; height: 14px; }

        @keyframes bounce {
            0% { height: 4px; }
            100% { height: 16px; }
        }

        /* Botones */
        button { 
            width: 100%;
            padding: 18px 20px; 
            font-size: 16px; 
            border-radius: 50px; 
            border: none; 
            color: white; 
            font-weight: 700; 
            letter-spacing: 1px;
            cursor: pointer; 
            transition: all 0.2s ease;
            margin-bottom: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            text-transform: uppercase;
            font-family: 'Outfit', sans-serif;
        }

        button:active { transform: scale(0.96); }

        #loginBtn, #playBtn { background-color: var(--spotify-green); }
        #loginBtn:hover, #playBtn:hover { 
            background-color: var(--spotify-green-hover); 
            box-shadow: 0 8px 25px rgba(29, 185, 84, 0.4);
        }

        #pauseBtn { background-color: var(--danger-red); }
        #pauseBtn:hover { 
            background-color: var(--danger-red-hover); 
            box-shadow: 0 8px 25px rgba(229, 9, 20, 0.4);
        }

        /* Temporizador con fuente BEBAS NEUE */
        #timerDisplay { 
            font-family: 'Bebas Neue', cursive, sans-serif; 
            font-size: 65px; 
            margin-top: 20px; 
            display: none; 
            color: var(--spotify-green); 
            text-shadow: 0 0 20px rgba(29, 185, 84, 0.6); 
            letter-spacing: 4px;
        }
    </style>
</head>

        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        let cartaId = urlParams.get('id') || localStorage.getItem('current_carta');

        if (urlParams.get('id')) {
            localStorage.setItem('current_carta', urlParams.get('id'));
        }

        let timerInterval = null;
        let secondsPlayed = 0;
        let isPaused = false; 

        function updateTimerDisplay() {
            const minutes = Math.floor(secondsPlayed / 60);
            const seconds = secondsPlayed % 60;
            document.getElementById('timerDisplay').innerText = 
                String(minutes).padStart(2, '0') + ":" + 
                String(seconds).padStart(2, '0');
        }

        function startTimer() {
            document.getElementById('timerDisplay').style.display = 'block';
            if (!timerInterval) {
                timerInterval = setInterval(() => {
                    secondsPlayed++;
                    updateTimerDisplay();
                }, 1000);
            }
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        async function generateCodeChallenge(codeVerifier) {
            const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(codeVerifier));
            return btoa(String.fromCharCode(...new Uint8Array(digest))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        function generateRandomString(length) {
            let text = '';
            const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            for (let i = 0; i < length; i++) text += possible.charAt(Math.floor(Math.random() * possible.length));
            return text;
        }

        async function login() {
            const verifier = generateRandomString(128);
            localStorage.setItem('code_verifier', verifier);
            const challenge = await generateCodeChallenge(verifier);
            const params = new URLSearchParams({
                client_id: clientId,
                response_type: 'code',
                redirect_uri: redirectUri,
                scope: 'user-modify-playback-state user-read-playback-state',
                code_challenge_method: 'S256',
                code_challenge: challenge
            });
            window.location.href = `https://accounts.spotify.com/authorize?${params.toString()}`;
        }

        if (code) {
            document.getElementById('info').innerText = "Validando conexión...";
            const verifier = localStorage.getItem('code_verifier');
            fetch('https://accounts.spotify.com/api/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({
                    client_id: clientId,
                    grant_type: 'authorization_code',
                    code: code,
                    redirect_uri: redirectUri,
                    code_verifier: verifier
                })
            }).then(r => r.json()).then(data => {
                localStorage.setItem('spotify_token', data.access_token);
                window.location.href = redirectUri + "?id=" + cartaId; 
            }).catch(err => {
                document.getElementById('info').innerHTML = "Error en la conexión.<br>Reinicia la página.";
            });
        } else {
            iniciarApp();
        }

        function iniciarApp() {
            const token = localStorage.getItem('spotify_token');
            if (!token) {
                document.getElementById('info').innerText = "Conecta la web con Spotify para que la música suene de forma invisible.";
                document.getElementById('loginBtn').style.display = 'inline-block';
            } else {
                if (cartaId && canciones[cartaId]) {
                    document.getElementById('info').innerHTML = "¡Lista!<br><br>Asegúrate de tener Spotify abierto de fondo y pulsa reproducir.";
                    document.getElementById('playBtn').style.display = 'inline-block';
                } else if (cartaId) {
                    document.getElementById('info').innerText = "Error: Esta carta no está guardada en el código.";
                } else {
                    document.getElementById('info').innerText = "Conectado y listo. Escanea cualquier código QR para empezar.";
                }
            }
        }

        function reproducir() {
            const token = localStorage.getItem('spotify_token');
            const trackUri = canciones[cartaId];

            let fetchOptions = {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            };

            if (!isPaused) {
                fetchOptions.headers['Content-Type'] = 'application/json';
                fetchOptions.body = JSON.stringify({ uris: [trackUri] });
                secondsPlayed = 0; 
                updateTimerDisplay();
            }

            fetch('https://api.spotify.com/v1/me/player/play', fetchOptions).then(response => {
                if (response.ok || response.status === 204) {
                    // Texto con ecualizador visual
                    document.getElementById('info').innerHTML = "<div class='equalizer'><div class='bar'></div><div class='bar'></div><div class='bar'></div><div class='bar'></div></div> <span style='display:inline-block; vertical-align:bottom;'>¡Sonando en secreto!</span>";
                    
                    document.getElementById('playBtn').style.display = 'none';
                    document.getElementById('pauseBtn').style.display = 'inline-block';
                    
                    // Activar el fondo festivo
                    document.body.classList.add('playing-bg');
                    
                    isPaused = false; 
                    startTimer(); 
                } else if (response.status === 401) {
                    localStorage.removeItem('spotify_token');
                    alert("El permiso de Spotify ha caducado. Vamos a reconectar.");
                    login();
                } else if (response.status === 404 || response.status === 403) {
                    document.getElementById('info').innerHTML = "<b>⚠️ No encuentro tu reproductor.</b><br><br>Abre Spotify en tu móvil, pon una canción 1 segundo, dale a pausa y vuelve aquí.";
                }
            });
        }

        function pausar() {
            const token = localStorage.getItem('spotify_token');

            fetch('https://api.spotify.com/v1/me/player/pause', {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            }).then(response => {
                if (response.ok || response.status === 204) {
                    document.getElementById('info').innerText = "⏸ Pista en pausa.";
                    document.getElementById('pauseBtn').style.display = 'none'; 
                    document.getElementById('playBtn').innerText = "▶️ Reanudar Pista"; 
                    document.getElementById('playBtn').style.display = 'inline-block'; 
                    
                    // Apagar el fondo festivo
                    document.body.classList.remove('playing-bg');
                    
                    isPaused = true; 
                    stopTimer(); 
                }
            });
        }
    </script>
