<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hitster Festival Edition</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --card-bg: #181818;
            --spotify-green: #1DB954;
            --spotify-green-hover: #1ed760;
            --danger-red: #e50914;
            --danger-red-hover: #f6121d;
            --text-main: #ffffff;
            --text-muted: #a7a7a7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            background: #121212; 
            color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            padding: 20px; 
            transition: background 0.5s ease;
        }

        @keyframes festival-bg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body.playing-bg {
            background: linear-gradient(45deg, #0a0a0a, #053315, #1DB954, #121212);
            background-size: 300% 300%;
            animation: festival-bg 4s ease infinite;
        }

        .app-container {
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 40px 25px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        #info { 
            color: var(--text-muted); 
            font-size: 16px; 
            line-height: 1.6; 
            margin-bottom: 30px; 
            min-height: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .equalizer-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
        }

        .equalizer {
            display: inline-flex;
            align-items: flex-end;
            height: 16px;
            gap: 4px;
            margin-right: 10px;
        }
        .bar {
            width: 5px;
            background-color: var(--spotify-green);
            border-radius: 2px;
            animation: bounce 0.4s infinite alternate;
        }
        .bar:nth-child(1) { animation-delay: 0.1s; height: 10px; }
        .bar:nth-child(2) { animation-delay: 0.3s; height: 16px; }
        .bar:nth-child(3) { animation-delay: 0.0s; height: 8px; }
        .bar:nth-child(4) { animation-delay: 0.2s; height: 14px; }

        @keyframes bounce {
            0% { height: 4px; }
            100% { height: 16px; }
        }

        button { 
            width: 100%;
            padding: 18px 20px; 
            font-size: 16px; 
            border-radius: 50px; 
            border: none; 
            color: white; 
            font-weight: 700; 
            letter-spacing: 1px;
            cursor: pointer; 
            transition: all 0.2s ease;
            margin-bottom: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            text-transform: uppercase;
            font-family: 'Outfit', sans-serif;
        }

        button:active { transform: scale(0.96); }

        #loginBtn, #playBtn { background-color: var(--spotify-green); }
        #loginBtn:hover, #playBtn:hover { 
            background-color: var(--spotify-green-hover); 
            box-shadow: 0 8px 25px rgba(29, 185, 84, 0.4);
        }

        #pauseBtn { background-color: var(--danger-red); }
        #pauseBtn:hover { 
            background-color: var(--danger-red-hover); 
            box-shadow: 0 8px 25px rgba(229, 9, 20, 0.4);
        }

        #nextBtn { 
            background-color: #2a2a2a; 
            margin-top: 15px;
            font-size: 14px;
            padding: 15px 20px;
            color: #d1d1d1;
        }
        #nextBtn:hover { 
            background-color: #3e3e3e; 
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.05);
            color: white;
        }

        #timerDisplay { 
            font-family: 'Bebas Neue', cursive, sans-serif; 
            font-size: 65px; 
            margin-top: 10px; 
            display: none; 
            color: var(--spotify-green); 
            text-shadow: 0 0 20px rgba(29, 185, 84, 0.6); 
            letter-spacing: 4px;
        }
    </style>
</head>
