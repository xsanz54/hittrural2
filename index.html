<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hitster Secreto</title>
    <style>
        body { background-color: #121212; color: white; font-family: sans-serif; text-align: center; padding-top: 50px; }
        button { background-color: #1DB954; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 30px; cursor: pointer; font-weight: bold; margin-top: 20px;}
        button:hover { background-color: #1ed760; }
        #info { margin-top: 20px; color: #b3b3b3; padding: 0 20px; }
    </style>
</head>
<body>

    <h1>🎧 Hitster Party</h1>
    <div id="info">Preparando reproductor...</div>
    <button id="playBtn" style="display:none;" onclick="reproducir()">REPRODUCIR PISTA</button>

    <!-- SDK de Spotify -->
    <script src="https://sdk.scdn.co/spotify-player.js"></script>
    <script>
        // CONFIGURACIÓN: Tu Client ID ya está integrado
        const clientId = 'df32a706b07c4806b0268f1c18c90503'; 
        const redirectUri = window.location.origin + window.location.pathname;
        
        let token = localStorage.getItem('spotify_token');
        let deviceId = null;
        let player = null;

        // Base de datos de tus canciones (Puedes ir añadiendo más aquí)
        const canciones = {
            "carta1": "spotify:track:5dAtKXyrQoQW054LZqJ5dP?si=13f947d64cfd42e9", // Ejemplo 1
            "carta2": "spotify:track:0VjIjW4GlUZAMYd2vXMi3b"  // Ejemplo 2
        };

        // Obtener el ID que viene en el QR (ejemplo: tuweb.com/?id=carta1)
        const urlParams = new URLSearchParams(window.location.search);
        const cartaId = urlParams.get('id');

        // Capturar el token de la URL si viene de la redirección de Spotify
        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);
        if (params.get('access_token')) {
            token = params.get('access_token');
            localStorage.setItem('spotify_token', token);
            window.location.hash = '';
        }

        if (!token) {
            // Si no hay token, redirige a Spotify para iniciar sesión una vez
            window.location.href = `https://accounts.spotify.com/authorize?client_id=${clientId}&response_type=token&redirect_uri=${encodeURIComponent(redirectUri)}&scope=streaming%20user-read-private%20user-modify-playback-state`;
        }

        // Inicializar el reproductor de Spotify en segundo plano
        window.onSpotifyWebPlaybackSDKReady = () => {
            player = new Spotify.Player({
                name: 'Hitster Web Oculto',
                getOAuthToken: cb => { cb(token); },
                volume: 1.0
            });

            player.addListener('ready', ({ device_id }) => {
                deviceId = device_id;
                document.getElementById('info').innerText = "¡Listo para jugar! Escanea un código.";
                
                if (cartaId && canciones[cartaId]) {
                    document.getElementById('playBtn').style.display = 'inline-block';
                } else if (cartaId) {
                    document.getElementById('info').innerText = "Error: Esta carta no está registrada en la base de datos.";
                }
            });

            // Manejar errores de token caducado
            player.addListener('initialization_error', ({ message }) => { 
                localStorage.removeItem('spotify_token');
                location.reload(); 
            });

            player.connect();
        };

        // Función que suena al pulsar el botón sin mostrar nada de información
        function reproducir() {
            if (!deviceId || !cartaId) return;
            const uriCancion = canciones[cartaId];

            fetch(`https://api.spotify.com/v1/me/player/play?device_id=${deviceId}`, {
                method: 'PUT',
                body: JSON.stringify({ uris: [uriCancion] }),
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                }
            }).then(response => {
                if (response.ok) {
                    document.getElementById('info').innerText = "🎵 Reproduciendo en secreto...";
                    document.getElementById('playBtn').style.display = 'none';
                } else {
                    document.getElementById('info').innerText = "Asegúrate de tener la sesión activa o abre Spotify un segundo en algún dispositivo.";
                }
            });
        }
    </script>
</body>
</html>
